name: Build chiaki-ng Windows x86_64 (VC)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win_x64:
    name: Build chiaki-ng win_x64 (VC)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      # 2026-10-02: first commit with dynamic msys2 package resolution (no
      # more dead pinned-URL downloads for pkgconf and friends).
      vcpkg_baseline: 2200159cd465157f20133e363e4604ac4d68181b
      dep_folder: deps
      libplacebo_tag: v7.387.0
      sdl2_compat_tag: 2.32.74

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = (curl.exe -s https://vulkan.lunarg.com/sdk/latest.json | ConvertFrom-Json).windows
          echo Version $ver
          curl.exe -sL "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -o VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          host: 'windows'
          target: 'desktop'
          # No qtwebengine (matches the official MSYS2 release): PSN login
          # falls back to the system browser, keeping the portable zip small
          modules: 'qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile ".\ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Expand-Archive -LiteralPath "ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n9.0-latest-win64-gpl-shared-9.0" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # The shaderc badge now points at a pruned artifact; pin the latest
          # build that still exists in the bucket (2026-06-30).
          curl.exe -sL "https://storage.googleapis.com/shaderc/artifacts/prod/graphics_shader_compiler/shaderc/windows-vs2022-amd64-release/continuous/27/20260630-142440/install.zip" -o .\shaderc.zip
          Expand-Archive -LiteralPath "shaderc.zip" -DestinationPath "."
          cp "./install/*" "./${{ env.dep_folder }}" -Force -Recurse
          rm "./install" -r -force

      - name: Make build directory
        run: |
          mkdir build

      - name: Setup CMake 3.31
        run: |
          # CMake 4 removed compatibility with cmake_minimum_required < 3.5,
          # which the pinned vcpkg baseline's older ports (json-c, ...) need.
          curl.exe -sL "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip" -o cmake331.zip
          Expand-Archive cmake331.zip -DestinationPath C:\cmake331
          echo "C:\cmake331\cmake-3.31.6-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup pkg-config
        run: |
          # The pinned 2024-02 vcpkg downloads pkgconf from an msys2 URL that
          # has since been purged from the mirrors; providing PKG_CONFIG
          # ourselves makes vcpkg_find_acquire_program skip that download.
          choco install pkgconfiglite -y --no-progress
          echo "PKG_CONFIG=C:\ProgramData\chocolatey\bin\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          -Dd3d11=enabled `
          ./build
          ninja -C./build
          ninja -C./build install
          # With -Dd3d11=enabled meson setup already fails hard if a dep is
          # missing; this confirms the backend actually compiled in
          if (-not (Select-String -Path "${{ github.workspace }}\${{ env.dep_folder }}\include\libplacebo\config.h" -Pattern "#define PL_HAVE_D3D11 1" -Quiet)) {
            throw "libplacebo was built without the d3d11 backend (PL_HAVE_D3D11 not defined)"
          }

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir chiaki-ng-Win
          cp build\gui\chiaki.exe chiaki-ng-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libcrypto-*-x64.dll" chiaki-ng-Win
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libssl-*-x64.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll" chiaki-ng-Win
          # the 2026-10 baseline may not pull every optional DLL (hidapi,
          # fftw3); warn instead of failing on those, copy the rest
          foreach ($name in @("hidapi*.dll","fftw3.dll","opus.dll","libspeexdsp.dll","*lcms*.dll","miniupnpc.dll","json-c.dll","event*.dll")) {
            $found = Get-ChildItem "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin" -Filter $name -ErrorAction SilentlyContinue
            if ($found) { $found | cp -Destination chiaki-ng-Win } else { echo "WARNING: $name not found in vcpkg bin" }
          }
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" chiaki-ng-Win
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release chiaki-ng-Win\chiaki.exe
          # Fail the build instead of shipping a zip that can't launch: every
          # non-system DLL imported by the exe and our plugin must be present
          # VC runtime (msvcp*/vcruntime*/concrt) is intentionally excluded:
          # it comes from the installed VC++ redistributable, like upstream
          $system_dlls = '^(?i)(api-ms-|ext-ms-|ntdll|kernel32|user32|gdi32|shell32|ole32|oleaut32|advapi32|ws2_32|wsock32|mswsock|shlwapi|comctl32|comdlg32|uxtheme|d3d11|dxgi|dwmapi|winmm|imm32|opengl32|glu32|secur32|crypt32|cryptbase|bcrypt|userenv|wintrust|iphlpapi|dnsapi|dbghelp|setupapi|cfgmgr32|powrprof|msvcrt|ucrtbase|vcruntime|msvcp|concrt|win32u|version|normaliz|dinput8|xinput|winusb|hid|wtsapi32|ntmarta|dcomp|msimg32|ntoskrnl|rpcrt4|sspicli|sechost)'
          foreach ($bin in @("chiaki-ng-Win\chiaki.exe","chiaki-ng-Win\cpp-steam-tools.dll")) {
            $deps = dumpbin /DEPENDENTS $bin | Select-String '^\s+([\w\.\-]+\.dll)\s*$' | %{$_.Matches[0].Groups[1].Value} | ?{$_ -notmatch $system_dlls}
            foreach ($dep in $deps) {
              if (-not (Test-Path "chiaki-ng-Win\$dep")) {
                throw "Packaged $bin depends on '$dep' which is missing from chiaki-ng-Win"
              }
            }
          }
          echo "DLL dependency check passed"

      - name: Package chiaki-ng
        run: |
          $CHIAKI_VERSION_MAJOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_MINOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MINOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_PATCH = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_PATCH ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $RELEASE_PACKAGE_FILE = "chiaki-ng-win_x64-VC-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          Compress-Archive chiaki-ng-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-win_x64-VC-Release
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish to win64-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win64-latest"
          # mutable nightly-style release: replaced on every dispatched build
          gh release delete $tag --cleanup-tag --yes
          $installer = "chiaki-ng-windows-installer-$($env:GITHUB_SHA.Substring(0,8)).exe"
          cp chiaki-ng-windows-installer.exe $installer
          $notes = "Automated Windows x64 build of commit $($env:GITHUB_SHA.Substring(0,8)) ($($env:GITHUB_REF_NAME)).`n`nAssets: portable zip and installer exe.`nArtifact `chiaki-ng-win_x64-VC-Release` remains available under the run's Artifacts section for 7 days."
          gh release create $tag $installer $env:RELEASE_PACKAGE_PATH --target $env:GITHUB_SHA --title "Windows x64 latest build ($($env:GITHUB_SHA.Substring(0,8)))" --notes $notes --prerelease

# build mirror: chiaki-ng-build (fork Actions disabled by GitHub)
